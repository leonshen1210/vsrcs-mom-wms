 solid var(--line);border-radius:8px}.content{max-width:1600px;margin:0 auto;padding:28px 34px 60px}.banner{background:#eaf0ff;border:1px solid #d7e2ff;padding:13px 18px;border-radius:10px;color:#365587;margin-bottom:20px;display:flex;align-items:center;gap:10px}.banner strong{color:#26469c}.banner.warn{background:#fff1ed;border-color:#ffdbcf;color:#a5472d}.headrow{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:17px;flex-wrap:wrap}.headrow h2{font-size:16px;margin:0;font-weight:800}.headrow p{font-size:12px;color:var(--muted);margin:3px 0 0}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:8px;padding:9px 15px;background:white;color:#43506b;font-size:12px;font-weight:700}.btn:hover{border-color:#b8cbef;color:#245ed9}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.primary:hover{background:#194ac0}.btn.danger{border-color:#f9d2d5;color:#b83b45;background:#fff9f9}.btn.small{padding:6px 10px;font-size:11px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:22px}.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}.card-pad{padding:21px}.stat{padding:19px 21px;min-height:118px}.stat .label{color:var(--muted);font-size:12px}.stat .value{font-weight:850;font-size:30px;margin:4px 0 0;letter-spacing:-1px}.stat .delta{color:#8390a5;font-size:11px}.stat .iconbg{float:right;padding:11px;background:#eff3ff;border-radius:10px;font-size:22px}.two{grid-template-columns:1.4fr 1fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.section{margin-bottom:20px}.section-title{font-weight:800;font-size:15px;margin:0 0 14px}.section-sub{font-size:12px;color:var(--muted);margin:-8px 0 15px}.pill{display:inline-block;padding:3px 9px;font-size:11px;font-weight:750;border-radius:22px;background:#f0f2f7;color:#6b7790;white-space:nowrap}.pill.green{color:#0b #497ee9;border-radius:8px}.timeline{border-left:2px solid #e4eaf2;margin-left:7px;padding:0 0 0 19px}.event{position:relative;margin:0 0 18px}.event:before{content:'';width:9px;height:9px;border-radius:50%;background:#6d95ed;border:3px solid #fff;box-shadow:0 0 0 1px #b4c9ef;position:absolute;left:-27px;top:5px}.event .when{font-size:10px;color:var(--muted)}.event .what{font-size:12px;margin-top:4px}.event .what b{color:#344b6f}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select,.input,select.input{padding:9px 11px;border:1px solid #dce3ee;border-radius:8px;background:white;min-width:115px;color:#34435b}.toolbar input{width:245px}.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.info-item{padding:15px;background:#f8faff;border:1px solid #edf1f7;border-radius:9px}.info-item small{display:block;color:#8793a8}.info-item strong{font-size:16px}.pipeline{display:flex;gap:7px;margin:15px 0;align-items:center;overflow:auto}.pipeline .node{padding:11px 13px;border:1px solid #dee7f5;border-radius:9px;font-size:11px;text-align:center;background:#f8faff;flex:1;min-width:86px}.pipeline .node.on{background:#e8efff;border-color:#9cb8f4;color:#2456bb;font-weight:750}.pipeline .arrow{color:#aab5c6}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px}.tabs button{border:0;padding:12px 18px;background:transparent;color:#7c89a1;font-weight:750;border-bottom:3px solid transparent}.tabs button.active{color:#2862dc;border-color:#2862dc}.guide{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.guide .step{background:#f7faff;padding:17px;border-radius:10px;border:1px solid #e4ebfa}.step b{font-size:12px}.step p{color:var(--muted);font-size:11px;margin:4px 0 0}.empty{padding:28px 18px;text-align:center;color:#8996aa}.footnote{color:#8794a8;font-size:11px;line-height:1.8}.divider{height:1px;background:var(--line);margin:18px 0}.modal-back{position:fixed;inset:0;background:rgba(12,22,40,.56);z-index:20;display:flex;align-items:center;justify-content:center;padding:15px}.modal{width:min(500px,100%);background:#fff;border-radius:14px;box-shadow:0 20px 80px #0004;overflow:hidden}.modalheader{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modalheader h2{font-size:17px;margin:0}.modalbody{padding:21px 24px}.modalfooter{padding:15px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}.field{margin:0 0 17px}.field label{font-size:12px;color:#61708b;font-weight:750;display:block;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid #dbe3ef;border-radius:8px;padding:10px;font:inherit}.field small{color:var(--muted)}.toast{position:fixed;bottom:27px;right:28px;background:#1e2c45;color:white;box-shadow:0 10px 30px #17284644;border-radius:10px;padding:14px 19px;z-index:30;font-weight:700;max-width:350px}.kpi-chart{height:140px;display:flex;align-items:end;gap:12px;border-bottom:1px solid var(--line);padding-top:12px}.kpi-chart .bar{width:33px;border-radius:5px 5px 0 0;background:#85a9f6;position:relative}.kpi-chart .bar b{position:absolute;bottom:-23px;left:50%;transform:translateX(-50%);font-size:10px;color:#8190a5;white-space:nowrap}.labelrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0;color:#64728b;font-size:12px}.legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;color:#8c98ab;font-size:11px;margin:9px 0}.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}.note{background:#f6f9ff;border:1px solid #e3ecfb;border-radius:9px;padding:13px 15px;color:#5f708d;font-size:12px}.footer{color:#9aa6b8;font-size:11px;margin-top:26px;display:flex;justify-content:space-between;gap:12px}

<body><div style="position:relative;z-index:30;background:#e8f0ff;border-bottom:1px solid #bfcff4;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:10px 20px;font:12px/1.5 system-ui,'Microsoft YaHei',sans-serif;color:#344e7b"><strong>公开作品集演示 · 本页面数据均为模拟，不连接真实设备</strong><span><a href="index.html" style="font-weight:800;text-decoration:underline;color:#2d55ad">← 作品集首页</a>　·　<a href="prd.html" style="font-weight:800;text-decoration:underline;color:#2d55ad">完整 PRD</a></span></div><div class="app"><aside><div class="brand"><mark>VSRCS</mark><div class="subtitle">SMART MANUFACTURING / LITE</div></div><nav class="nav"><small>制造运营</small><button data-page="overview" class="active"><span>◫</span><span>运营总览</span></button><button data-page="wms"><span>▦</span><span>WMS · 库存</span></button><button data-page="tasks"><span>⇄</span><span>调度任务</span></button><button data-page="equipment"><span>⚙</span><span>设备管理</span></button><small>运营分析</small><button data-page="alerts"><span>◈</span><span>异常与恢复</span></button><button data-page="reports"><span>▤</span><span>运营报表</span></button><button data-page="settings"><span>◷</span><span>参数与规则</span></button></nav><div class="side-bottom"><b>PROTOTYPE v1.0</b><br>独立离线演示 · 非真实 PLC 系统</div></aside>
<main><header class="topbar"><div><div class="crumb">VSRCS / <span id="crumb">运营总览</span></div><div class="page-title" id="pageTitle">运营总览</div></div><div class="topright"><span class="online">模拟环境</span><select id="role" aria-label="操作角色"><option>班组长</option><option>操作员</option><option>设备工程师</option></select><button class="btn" id="resetDemo" title="清空本地演示状态并恢复初始数据">重置演示</button></div></header><div class="content"><div class="banner" id="banner"><strong>DEMO</strong> 交互原型使用虚拟库存与仿真状态；所有“执行、入库、恢复”仅修改浏览器内的演示数据，不会连接设备。</div><div id="screen"></div><div class="footer"><span>VSRCS · 4炉 / 1复合机器人 / LM6上下料 / LM7换电</span><span>简易 WMS + 调度 + 设备管理 · 产品设计示例</span></div></div></main></div><div id="modals"></div><div id="toastRoot"></div>
<script>
(() => {
'use strict';
const K='vsrcs_mom_demo_v1';const labels={overview:'运营总览',wms:'WMS · 库存管理',tasks:'生产与调度任务',equipment:'设备监控',alerts:'报警与异常恢复',reports:'运营数据分析',settings:'参数与规则'};
const now=()=>new Date().toLocaleString('zh-CN',{hour12:false});
const mat=(kind,furnace,no)=>({id:`M-${String(no).padStart(3,'0')}`,kind,furnace,created:now()});
function initial(){return {seq:30,page:'overview',raw:[mat('raw','F1',1),mat('raw','F1',2),mat('raw','F2',3),mat('raw','F3',4),mat('raw','F4',5),mat('raw','F2',6),null,null],cooling:[mat('cooked','F2',7),mat('cooked','F3',8),null,null,null,null,null,null],backpack:[mat('cooked','F3',9),null,null],furnaces:[{id:'F1',state:'idle',material:null,z:5},{id:'F2',state:'done',material:mat('cooked','F2',10),z:4},{id:'F3',state:'running',material:mat('raw','F3',11),z:3},{id:'F4',state:'maintenance',material:null,z:6}],tasks:[{id:'T-1028',furnace:'F2',mode:'F1',status:'done',phase:'done',created:'2026/11/16 08:20:00',ended:'2026/11/16 08:29:00'}],active:null,position:'LM6',battery:76,lock:false,alarm:[],ledger:[{at:'08:29',id:'M-007',type:'熟料入库',from:'AGV',to:'冷却区 C1',reason:'系统归档'},{at:'08:11',id:'M-006',type:'生料入库',from:'人工装载',to:'原料区 R6',reason:'操作员选炉 F2'}],events:[{at:'08:29',text:'任务 T-1028 已完成，熟料进入冷却区'},{at:'08:24',text:'AGV 到达 LM6，背包物料状态已同步'},{at:'08:11',text:'新料入库：目标炉 F2，原料缓存位 R6'}],stats:{finished:1,loaded:1,alarm:0},threshold:10,mode:'auto'};}
let state;try{state=JSON.parse(localStorage.getItem(K)||'null')||initial()}catch(e){state=initial()}
const persist=()=>{try{localStorage.setItem(K,JSON.stringify(state))}catch(e){}};
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tell(text){$('toastRoot').innerHTML=`<div class="toast">${esc(text)}</div>`;setTimeout(()=>{$('toastRoot').innerHTML=''},3100)}
function record(text){state.events.unshift({at:now().slice(-8),text});state.events=state.events.slice(0,100)}
function ledger(id,type,from,to,reason){state.ledger.unshift({at:now().slice(-8),id,type,from,to,reason});state.ledger=state.ledger.slice(0,200)}
const count=a=>a.filter(Boolean).length;
const pill=(label,type='')=>`<span class="pill ${type}">${esc(label)}</span>`;
const furnaceStatus={idle:['待机','blue'],running:['烧结中','amber'],done:['已完成','green'],maintenance:['维护中','red']};
const modeName={F0:'LOAD · 只放生料',F1:'SWAP · 取熟料并放生料',F2:'UNLOAD · 只取熟料'};
function stat(label,v,sub,icon){return `<div class="card stat"><div class="iconbg">${icon}</div><div class="label">${label}</div><div class="value">${v}</div><div class="delta">${sub}</div></div>`}
function heading(title,sub='',tools=''){return `<div class="headrow"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div><div class="actions">${tools}</div></div>`}
function slots(arr,prefix){return `<div class="slots ${prefix==='B'?'bag':''}">${arr.map((m,i)=>`<button class="slot ${m?(m.kind==='cooked'?'finished':'used'):''}" data-slot="${prefix}:${i}" title="查看库位"><small>${prefix}${i+1} · ${m?(m.kind==='raw'?'生料':'熟料'):'空位'}</small><strong>${m?esc(m.id):'—'}</strong><em>${m?'目标/来源 '+m.furnace:'可用'}</em></button>`).join('')}</div>`}
function furnaceCards(short=false){return `<div class="furnaces">${state.furnaces.map(f=>`<div class="furnace"><div style="display:flex;justify-content:space-between;gap:6px"><div><div class="id">${f.id}</div><div class="station">${f.id.replace('F','LM')} · 真空烧结炉</div></div><span style="font-size:23px">♨</span></div><div class="status-row">${pill(...furnaceStatus[f.state])}</div><div class="foot">炉内物料：<strong>${f.material?esc(f.material.id):'无'}</strong></div>${short?'':`<div class="foot">Z轴补偿：<strong>${f.z} mm</strong></div><button class="btn small" data-furnace="${f.id}">查看 / 操作</button>`}<div class="spark">${Array.from({length:8},(_,i)=>`<i class="${(f.state==='running'?i<5:(f.state==='done'?i<8:i<1))?'on':''}"></i>`).join('')}</div></div>`).join('')}</div>`}
function taskStatus(t){return t.status==='done'?pill('已完成','green'):t.status==='paused'?pill('已暂停','red'):t.status==='running'?pill('执行中','blue'):t.status==='failed'?pill('异常','red'):pill('待执行','amber')}
function taskTable(items){return `<div class="table-wrap"><table><thead><tr><th>任务编号</th><th>目标炉位</th><th>作业模式</th><th>任务状态</th><th>执行阶段</th><th>创建时间</th></tr></thead><tbody>${items.map(t=>`<tr><td class="idtext">${esc(t.id)}</td><td>${t.furnace}</td><td>${modeName[t.mode]||'—'} (${t.mode})</td><td>${taskStatus(t)}</td><td>${esc(({ready:'待领料',to_furnace:'前往炉位',back:'回LM6卸料',done:'已闭环'}[t.phase]||t.phase))}</td><td class="muted">${esc(t.created)}</td></tr>`).join('')||`<tr><td colspan="6" class="empty">暂无任务</td></tr>`}</tbody></table></div>`}
function eventList(n=5){return `<div class="timeline">${state.events.slice(0,n).map(e=>`<div class="event"><div class="when">${esc(e.at)}</div><div class="what">${esc(e.text)}</div></div>`).join('')}</div>`}
function renderOverview(){return `${heading('生产运营驾驶舱','展示库存、生产、设备与调度的统一业务视图',`<button class="btn primary" data-action="makeTask">+ 新建调度任务</button>`)}<div class="grid stats">${stat('原料缓存库存',count(state.raw),'原料区 8 个逻辑缓存位','▣')}${stat('熟料 / 冷却区',count(state.cooling),'冷却区 8 个逻辑缓存位','▤')}${stat('累计完成任务',state.stats.finished,'演示会话累计','✓')}${stat('活动报警',state.alarm.filter(a=>a.active).length,'关键动作受到恢复锁约束','!')}</div><section class="section">${heading('炉位实时状态','4台真空烧结炉 · LM1—LM4')} ${furnaceCards(true)}</section><div class="grid two"><div class="card card-pad">${heading('作业流转与执行','状态变更仅用于模拟演示',`<button class="btn primary small" data-action="next">▶ 模拟执行下一步</button>`)}<div class="pipeline"><div class="node ${state.active?.phase==='ready'?'on':''}">① LM6领料</div><span class="arrow">→</span><div class="node ${state.active?.phase==='to_furnace'?'on':''}">② 炉前取放</div><span class="arrow">→</span><div class="node ${state.active?.phase==='back'?'on':''}">③ LM6回库</div><span class="arrow">→</span><div class="node">④ 库存闭环</div></div><div class="info-grid"><div class="info-item"><small>当前任务</small><strong>${state.active?state.active.id:'待调度'}</strong></div><div class="info-item"><small>AGV当前位置 / 电量</small><strong>${state.position} · ${state.battery}%</strong></div></div><div class="divider"></div><div class="legend"><span>${pill('LOAD','blue')} 只放</span><span>${pill('SWAP','green')} 取放</span><span>${pill('UNLOAD','amber')} 只取</span></div>${taskTable(state.tasks.slice(0,3))}</div><div class="card card-pad">${heading('最近操作记录','入库、调度与异常事件追溯')}${eventList(7)}</div></div>`}
function renderWMS(){return `${heading('WMS · 库存与库位','简易WMS：物料/烧盒库存、炉号归属、逻辑库位与转运状态',`<button class="btn primary" data-action="inbound">+ 人工生料入库</button><button class="btn" data-action="export">导出库存流水</button>`)}<div class="grid stats">${stat('生料在库',count(state.raw),'待安排 / 待装炉','▣')}${stat('熟料在库',count(state.cooling),'水冷/成品待出库','◩')}${stat('AGV背包占用',`${count(state.backpack)}/3`,'3层车载缓存','▥')}${stat('炉内物料',state.furnaces.filter(f=>f.material).length,'烧结中 / 待出炉','♨')}</div><div class="inventory-groups section"><div class="card card-pad">${heading('生料缓存区 · R1–R8','工人选择目标炉号后登记入库；不依赖工人扫码')}${slots(state.raw,'R')}<div class="legend"><span><i style="background:#b9cdf7"></i>已占用</span><span><i style="background:#e5ebf3"></i>空位</span></div></div><div class="card card-pad">${heading('熟料冷却区 · C1–C8','此处将冷却区抽象为8个逻辑缓存位；实物出库需人工确认')}${slots(state.cooling,'C')}<div class="legend"><span><i style="background:#b4dfcc"></i>熟料</span><span><i style="background:#e5ebf3"></i>空位</span></div></div></div><div class="grid two"><div class="card card-pad">${heading('AGV车载背包 · 3层','生料/熟料均由调度中枢统一维护库存归属')}${slots(state.backpack,'B')}<div class="note" style="margin-top:15px">真实现场的 PLC/AGV 使用三层编码与作业握手。此原型仅模拟逻辑占用，不发送任何 Modbus 指令。</div></div><div class="card card-pad">${heading('库存业务规则','防错与库存一致性') }<div class="guide" style="grid-template-columns:1fr"><div class="step"><b>01 · 指定目标炉号</b><p>由工人/HMI 手动选 F1–F4；不虚构现场入库扫码。</p></div><div class="step"><b>02 · 移库必须有动作确认</b><p>逻辑库存随调度阶段更新；异常时保留待核对状态，不盲目重发动作。</p></div><div class="step"><b>03 · 出库需要审核记录</b><p>演示支持冷却区人工出库，生成时间、物料和操作原因流水。</p></div></div></div></div><div class="card card-pad">${heading('最近库存流水','展示来源库位、目标库位及业务原因')}${ledgerTable(12)}</div>`}
function ledgerTable(n){return `<div class="table-wrap"><table><thead><tr><th>时间</th><th>物料编码</th><th>类型</th><th>来源</th><th>去向</th><th>备注</th></tr></thead><tbody>${state.ledger.slice(0,n).map(r=>`<tr><td class="muted">${esc(r.at)}</td><td class="idtext">${esc(r.id)}</td><td>${esc(r.type)}</td><td>${esc(r.from)}</td><td>${esc(r.to)}</td><td class="muted">${esc(r.reason)}</td></tr>`).join('')||'<tr><td colspan="6">无数据</td></tr>'}</tbody></table></div>`}
function renderTasks(){return `${heading('调度任务管理','LOAD只放 · SWAP取放 · UNLOAD只取；以炉位状态、库存和背包容量决定作业模式',`<button class="btn primary" data-action="makeTask">+ 生成作业任务</button><button class="btn" data-action="next">模拟执行下一步</button>`)}<div class="grid stats">${stat('待执行',state.tasks.filter(t=>t.status==='pending').length,'进入调度队列','◷')}${stat('执行中',state.tasks.filter(t=>t.status==='running').length,'串行调度 1 台 AGV','↗')}${stat('已完成',state.tasks.filter(t=>t.status==='done').length,'包含初始化演示记录','✓')}${stat('当前电量',`${state.battery}%`,`低于 ${state.threshold}% 停止正常取料`,'▰')}</div><div class="grid two section"><div class="card card-pad">${heading('当前任务详情',state.active?'有任务处于执行链路':'暂无活动任务')} ${state.active?`<div class="info-grid"><div class="info-item"><small>任务编号</small><strong>${state.active.id}</strong></div><div class="info-item"><small>目标炉 / 模式</small><strong>${state.active.furnace} / ${state.active.mode}</strong></div><div class="info-item"><small>当前阶段</small><strong>${esc(state.active.phase)}</strong></div><div class="info-item"><small>安全锁</small><strong>${state.lock?'已锁定':'未锁定'}</strong></div></div>`:'<div class="empty">创建新任务，点击“模拟执行下一步”，即可演示完整状态机。</div>'}<div class="divider"></div><div class="actions"><button class="btn primary" data-action="next" ${state.lock?'disabled':''}>▶ 下一步</button><button class="btn danger" data-action="inject" ${!state.active?'disabled':''}>模拟故障 / 恢复锁</button></div></div><div class="card card-pad">${heading('调度决策约束','先满足安全互锁，再考虑作业效率')}<div class="note">一台复合机器人同一时刻仅执行一条任务。炉维护 / 烧结中不可新派炉前任务；F1要求生料与熟料预留空间；低电量、急停、恢复锁时不接收正常动作。</div><div class="divider"></div><div class="section-title">作业模式</div><div class="labelrow">LOAD · 只放新料 <span>空炉 + 有生料</span></div><div class="labelrow">SWAP · 取熟料并放生料 <span>炉已完成 + 有新料</span></div><div class="labelrow">UNLOAD · 只取熟料 <span>炉已完成 + 无生料</span></div></div></div><div class="card card-pad">${heading('任务列表','列表按最新任务优先展示')}${taskTable(state.tasks)}</div>`}
function renderEquipment(){return `${heading('设备管理与工位状态','位置：LM1–LM4 炉位 / LM6 上下料 / LM7 人工换电',`<button class="btn" data-action="battery">模拟电量 -15%</button>`)}<div class="grid stats">${stat('AGV当前工位',state.position,'站点级定位','◎')}${stat('AGV剩余电量',state.battery+'%','低电量阈值 '+state.threshold+'%','▰')}${stat('PLC链路','模拟在线','真实网络未接入','↔')}${stat('机械臂','模拟待命','作业中将进入运行状态','⚙')}</div><section class="section">${heading('生产设备 · F1–F4','点击炉位查看控制与联动信息')}${furnaceCards(false)}</section><div class="grid two"><div class="card card-pad">${heading('车间站点','示意流程：炉区 ↔ LM6 ↔ LM7')}<div class="pipeline"><div class="node">LM1–LM4<br><b>炉位作业</b></div><span class="arrow">↔</span><div class="node">LM6<br><b>生熟料交换</b></div><span class="arrow">↔</span><div class="node">LM7<br><b>换电位</b></div></div><div class="note">LM6 进行视觉 XY/Rz 纠偏；LM1–LM4 使用炉位配置补偿。此页面仅展示产品抽象，不代表实时定位画面。</div></div><div class="card card-pad">${heading('低电量策略','以业务安全为优先') }<p class="muted">AGV低于10%时不接收正常取料调度；尽可能先卸下车载物料，再前往LM7换电。真实现场换电必须执行设备安全流程。</p><div class="progress"><div style="width:${state.battery}%"></div></div><div style="height:15px"></div><button class="btn" data-action="charge">模拟人工换电完成（90%）</button></div></div>`}
function renderAlerts(){const active=state.alarm.filter(a=>a.active);return `${heading('报警与异常恢复','关键原则：物理动作结果不确定时，人工核验前禁止自动重发',`<button class="btn danger" data-action="inject">模拟撞机/视觉异常</button>`)}${state.lock?`<div class="banner warn"><strong>恢复锁已激活</strong> 请先现场确认安全状态，再由授权人员在演示中确认恢复；实际设备不允许远程绕过安全回路。</div>`:''}<div class="grid stats">${stat('当前报警',active.length,'只统计未关闭报警','!')}${stat('恢复锁状态',state.lock?'已锁定':'正常','锁定禁止任务推进','◈')}${stat('当前任务',state.active?.id||'无','锁定不会清除任务阶段','⇄')}${stat('AGV所在站点',state.position,'请核对实物与系统记录','◎')}</div><div class="card card-pad section">${heading('报警事件','保留故障时间、受影响任务和处置记录',`${state.lock?'<button class="btn primary" data-action="recover">人工核对并恢复</button>':''}`)}<div class="table-wrap"><table><thead><tr><th>事件号</th><th>发生时间</th><th>类型</th><th>关联任务</th><th>处置状态</th></tr></thead><tbody>${state.alarm.map(a=>`<tr><td class="idtext">${esc(a.id)}</td><td>${esc(a.at)}</td><td>${esc(a.type)}</td><td>${esc(a.task||'—')}</td><td>${a.active?pill('待人工核验','red'):pill('已确认','green')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">当前无报警，可使用“模拟撞机/视觉异常”演示恢复锁逻辑</td></tr>'}</tbody></table></div></div><div class="card card-pad">${heading('异常处理业务规则','安全确认不是软件自动清除故障') }<div class="guide"><div class="step"><b>① 冻结调度</b><p>保存任务ID、阶段、AGV位置与背包占用；阻止同一物理动作重复下发。</p></div><div class="step"><b>② 核实现场</b><p>核对设备急停、机械臂安全位置、炉门、物料、PLC状态及库位一致性。</p></div><div class="step"><b>③ 授权恢复</b><p>演示中恢复仅继续模拟状态机；实际系统仍需设备安全互锁和现场放行。</p></div></div></div>`}
function renderReports(){const types=state.ledger.reduce((a,r)=>(a[r.type]=(a[r.type]||0)+1,a),{});return `${heading('运营分析报表','以库存流水与任务事件构建可追溯的基础运营指标',`<button class="btn" data-action="export">导出库存流水 CSV</button>`)}<div class="grid stats">${stat('总库存（逻辑单元）',count(state.raw)+count(state.cooling)+count(state.backpack)+state.furnaces.filter(f=>f.material).length,'跨库位库存总量','▦')}${stat('入库操作',state.ledger.filter(x=>x.type.includes('入库')).length,'演示期间记录','▣')}${stat('完成任务',state.tasks.filter(t=>t.status==='done').length,'包含演示初始记录','✓')}${stat('累计报警',state.alarm.length,'含已解除事件','◈')}</div><div class="grid two"><div class="card card-pad">${heading('物料分布','根据当前逻辑库存实时计算')}<div class="labelrow"><span>原料缓存 R1–R8</span><strong>${count(state.raw)}</strong></div><div class="progress"><div style="width:${count(state.raw)/8*100}%"></div></div><div class="labelrow"><span>冷却区 C1–C8</span><strong>${count(state.cooling)}</strong></div><div class="progress"><div style="width:${count(state.cooling)/8*100}%;background:#29aa88"></div></div><div class="labelrow"><span>背包 B1–B3</span><strong>${count(state.backpack)}</strong></div><div class="progress"><div style="width:${count(state.backpack)/3*100}%;background:#f3b453"></div></div><div class="labelrow"><span>炉内物料 F1–F4</span><strong>${state.furnaces.filter(f=>f.material).length}</strong></div><div class="progress"><div style="width:${state.furnaces.filter(f=>f.material).length/4*100}%;background:#a29cf3"></div></div></div><div class="card card-pad">${heading('产品指标设计','生产环境需接入真实采样和计时数据')}<div class="guide" style="grid-template-columns:1fr"><div class="step"><b>任务完成率</b><p>完成任务数 / 已结束任务数；异常中断需有明确分母规则。</p></div><div class="step"><b>库存一致率</b><p>实盘一致库位数 / 已盘点库位数；当前 DEMO 未接真实盘点。</p></div><div class="step"><b>设备稼动率 / OEE</b><p>需要真实停机原因、有效加工时间及产量数据；原型不伪造改善百分比。</p></div></div></div></div><div class="card card-pad section">${heading('出入库操作明细','可在 WMS 页面生成更多业务流水')}${ledgerTable(100)}</div>`}
function renderSettings(){return `${heading('参数与业务规则','现场参数应通过权限控制和版本审计管理')}<div class="grid two"><div class="card card-pad">${heading('炉位补偿参数','演示展示真实项目使用的炉位级配置方式')}<div class="table-wrap"><table><thead><tr><th>炉号</th><th>站点</th><th>Z轴补偿</th><th>操作</th></tr></thead><tbody>${state.furnaces.map(f=>`<tr><td class="idtext">${f.id}</td><td>LM${f.id.slice(1)}</td><td>${f.z} mm</td><td><button class="btn small" data-z="${f.id}">编辑演示值</button></td></tr>`).join('')}</tbody></table></div><div class="note" style="margin-top:15px">演示修改不会写入真实机器人控制器。真实设备补偿应通过标定验证、审批及记录管理。</div></div><div class="card card-pad">${heading('调度配置','关键阈值展示')}<div class="info-grid"><div class="info-item"><small>AGV背包容量</small><strong>3层</strong></div><div class="info-item"><small>低电量换电阈值</small><strong>10%</strong></div><div class="info-item"><small>原料缓存位</small><strong>8</strong></div><div class="info-item"><small>冷却缓存位（产品抽象）</small><strong>8</strong></div></div><div class="divider"></div><div class="labelrow"><span>系统模式</span>${pill(state.mode==='auto'?'自动调度':'维护/下班','blue')}</div><button class="btn" data-action="toggleMode">切换演示模式</button></div></div><div class="card card-pad" style="margin-top:18px">${heading('本原型与真实项目边界','便于产品经理面试时清晰陈述')}<div class="guide"><div class="step"><b>已知真实业务基础</b><p>四台炉、单台复合机器人、三层背包、目标炉人工选择、PLC通信、任务状态持久化、简易WMS库存管理。</p></div><div class="step"><b>原型所做抽象</b><p>以 R1–R8/C1–C8表示逻辑缓存位；内部物料ID和演示库存是示例数据，不代表工人扫码或完整批次追溯已上线。</p></div><div class="step"><b>产品化增强方向</b><p>库存流水看板、原型级数据指标、异常工单审计、角色权限、后续与MES/ERP对接及AI运维建议。</p></div></div></div>`}
function render(){const page=state.page in labels?state.page:'overview';$('crumb').textContent=labels[page];$('pageTitle').textContent=labels[page];document.querySelectorAll('[data-page]').forEach(e=>e.classList.toggle('active',e.dataset.page===page));$('banner').classList.toggle('warn',state.lock);$('banner').innerHTML=state.lock?'<strong>安全锁定</strong> 当前执行链路被模拟故障阻断；恢复前不可执行下一步任务。':'<strong>DEMO</strong> 交互原型使用虚拟库存与仿真状态；所有“执行、入库、恢复”仅修改浏览器内的演示数据，不会连接设备。';$('screen').innerHTML=({overview:renderOverview,wms:renderWMS,tasks:renderTasks,equipment:renderEquipment,alerts:renderAlerts,reports:renderReports,settings:renderSettings}[page])();persist()}
function showModal(title,body,buttons){$('modals').innerHTML=`<div class="modal-back"><div class="modal" role="dialog" aria-modal="true"><div class="modalheader"><h2>${title}</h2><button class="btn small" data-close="1">✕</button></div><div class="modalbody">${body}</div><div class="modalfooter">${buttons}</div></div></div>`}
function closeModal(){$('modals').innerHTML=''}
function requireLead(){if($('role').value==='操作员'){tell('此操作需要班组长或设备工程师权限');return false}return true}
function inbound(){if(state.lock){tell('恢复锁生效期间禁止人工修改库存');return}const free=state.raw.map((x,i)=>!x?i:-1).filter(i=>i>=0);if(!free.length){tell('生料缓存已满');return}showModal('人工生料入库 · 不扫码',`<div class="field"><label>目标炉号（由工人/HMI手动指定）</label><select id="inF">${state.furnaces.map(f=>`<option value="${f.id}">${f.id} ${f.state==='maintenance'?'（炉维护中）':''}</option>`).join('')}</select></div><div class="field"><label>入库逻辑库位</label><select id="inSlot">${free.map(i=>`<option value="${i}">R${i+1}</option>`).join('')}</select></div><div class="field"><label>物料信息</label><input disabled value="自动生成演示逻辑ID（不是实物扫码标识）"><small>完整物料条码追溯属于可选的产品化扩展。</small></div>`,`<button class="btn" data-close="1">取消</button><button class="btn primary" data-confirm="inbound">确认入库</button>`)}
function doInbound(){const slot=+$('inSlot').value,f=$('inF').value;if(state.raw[slot])return tell('库位已被占用');const m=mat('raw',f,++state.seq);state.raw[slot]=m;ledger(m.id,'生料入库','人工投料',`原料区 R${slot+1}`,`HMI手动选择 ${f}`);record(`生料 ${m.id} 入库至 R${slot+1}，目标 ${f}`);closeModal();render();tell('模拟入库成功，库存已更新')}
function makeTask(){if(state.lock||state.mode!=='auto'){tell('当前已锁定或不在自动调度模式');return}if(state.battery<state.threshold){tell('电量低于换电阈值，禁止接收正常任务');return}showModal('创建生产调度任务',`<div class="field"><label>目标炉</label><select id="taskF">${state.furnaces.map(f=>`<option value="${f.id}">${f.id} · ${furnaceStatus[f.state][0]}</option>`).join('')}</select></div><div class="note">系统根据炉位和原料库存自动判断 LOAD/SWAP/UNLOAD。若炉位处于维护/烧结中或已有未完成任务，禁止重复派发。</div>`,`<button class="btn" data-close="1">取消</button><button class="btn primary" data-confirm="task">生成任务</button>`)}
function doTask(){const f=$('taskF').value, furnace=state.furnaces.find(x=>x.id===f);if(state.tasks.some(t=>t.furnace===f&&['pending','running','paused'].includes(t.status))){tell('该炉已有未完成任务，不可重复派单');return}if(['maintenance','running'].includes(furnace.state)){tell('烧结中或维护中的炉位不可派发');return}const allocated=new Set(state.tasks.filter(t=>t.status==='pending'&&t.rawSlot!==undefined).map(t=>t.rawSlot));const rawSlot=state.raw.findIndex((m,i)=>m?.furnace===f&&!allocated.has(i));const mode=furnace.state==='idle'?(rawSlot>=0?'F0':null):(furnace.state==='done'?(rawSlot>=0?'F1':'F2'):null);if(!mode){tell('无可执行动作：空炉缺少生料库存');return}const id='T-'+String(++state.seq+1000);const task={id,furnace:f,mode,status:'pending',phase:'ready',rawSlot:rawSlot>=0?rawSlot:undefined,created:now()};state.tasks.unshift(task);record(`${id} 创建：${f} ${modeName[mode]}`);closeModal();render();tell(`${id} 已加入调度队列 (${mode})`)}
function freeBag(){return state.backpack.findIndex(x=>!x)}
function nextStep(){if(state.lock){tell('处于恢复锁状态，禁止推进任务');return}if(state.mode!=='auto'){tell('维护模式下不允许正常调度');return}if(!state.active){const pending=[...state.tasks].reverse().find(t=>t.status==='pending');if(!pending){tell('暂无待执行任务，请先创建任务');return}if(state.battery<state.threshold){tell('AGV低电量，正常取料被阻断');return}const need=pending.mode==='F1'?2:1, empty=state.backpack.filter(x=>!x).length;if(empty<need){tell(`背包空位不足：${pending.mode} 需预留${need}个空位（可先卸熟料）`);return}state.active=pending;pending.status='running';record(`${pending.id} 已启动，执行阶段已持久化（模拟）`)}const t=state.active,f=state.furnaces.find(x=>x.id===t.furnace);if(t.phase==='ready'){
 if(t.mode!=='F2'){const m=state.raw[t.rawSlot];if(!m){record('库存状态不一致，进入恢复锁');inject('原料位为空/任务库存不同步');return}const dst=freeBag();if(dst<0){tell('背包无空位');return}state.raw[t.rawSlot]=null;state.backpack[dst]=m;ledger(m.id,'移库','原料区 R'+(t.rawSlot+1),'AGV B'+(dst+1),'LM6领料');record(`${t.id} 在LM6领取生料 ${m.id}，移至背包 B${dst+1}`)}else record(`${t.id} F2仅取熟料，AGV从LM6出发`);state.position='LM6';t.phase='to_furnace';render();tell('第一阶段完成：准备前往炉位');return
 }
 if(t.phase==='to_furnace'){
  if(t.mode==='F1'||t.mode==='F2'){if(!f.material||f.state!=='done'){inject('炉内熟料状态不一致');return}const dst=freeBag();if(dst<0){tell('背包无熟料预留空位');return}f.material.kind='cooked';state.backpack[dst]=f.material;ledger(f.material.id,'熟料取炉',t.furnace,'AGV B'+(dst+1),t.mode);record(`${t.id} 从${t.furnace}取出熟料 ${f.material.id}`);f.material=null}
  if(t.mode==='F0'||t.mode==='F1'){const idx=state.backpack.findIndex(m=>m?.kind==='raw'&&m.furnace===t.furnace);if(idx<0){inject('背包新料与炉位不匹配');return}const m=state.backpack[idx];state.backpack[idx]=null;f.material=m;f.state='running';ledger(m.id,'生料装炉','AGV B'+(idx+1),t.furnace,t.mode);record(`${t.id} 生料 ${m.id} 装入${t.furnace}，进入烧结中（模拟）`);state.stats.loaded++}else{f.state='idle';record(`${t.id} ${t.furnace} 出炉后状态置空闲`)}state.position='LM'+t.furnace.slice(1);state.battery=Math.max(0,state.battery-7);t.phase='back';render();tell('第二阶段完成：炉前取放料模拟结束');return
 }
 if(t.phase==='back'){
  const cooked=state.backpack.map((m,i)=>m?.kind==='cooked'?i:-1).filter(i=>i>=0), free=state.cooling.filter(x=>!x).length;if(free<cooked.length){tell('冷却区空位不足，任务暂停等待人工处理');record(`${t.id} 熟料回库受阻，冷却位不足`);return}for(const idx of cooked){const m=state.backpack[idx];const dst=state.cooling.findIndex(x=>!x);state.cooling[dst]=m;state.backpack[idx]=null;ledger(m.id,'熟料回库','AGV B'+(idx+1),'冷却区 C'+(dst+1),'LM6卸料')}
  t.phase='done';t.status='done';t.ended=now();state.position='LM6';state.active=null;state.stats.finished++;record(`${t.id} 完成，LM6熟料回库且任务状态闭环`);render();tell('任务已完成，库存流水已更新');return
 }
 }
function inject(reason='模拟机械臂撞机 / 视觉识别异常'){if(state.lock){tell('已有活动恢复锁');return}state.lock=true;const id='A-'+String(++state.seq);state.alarm.unshift({id,at:now(),type:reason,task:state.active?.id||'—',active:true});if(state.active)state.active.status='paused';state.stats.alarm++;record(`${id} 报警：${reason}，冻结调度并保留当前任务阶段`);render();tell('已触发恢复锁：下一步动作被禁止')}
function recover(){if(!state.lock){tell('没有待恢复的安全锁');return}if(!requireLead())return;showModal('人工核对并恢复 · 演示',`<div class="note" style="background:#fff3e5;border-color:#ffe3ad;color:#8a5912">请注意：真实现场恢复必须由有资质人员核验物理状态，不允许仅通过软件按钮忽略危险。</div><div class="field" style="margin-top:18px"><label><input type="checkbox" id="r1" style="width:auto"> 已确认现场急停/机械臂/炉门与人员安全</label></div><div class="field"><label><input type="checkbox" id="r2" style="width:auto"> 已核对 AGV 背包与炉内实物状态一致</label></div><div class="field"><label><input type="checkbox" id="r3" style="width:auto"> 已核对 PLC 状态、任务编号与执行阶段一致</label></div>`,`<button class="btn" data-close="1">取消</button><button class="btn primary" data-confirm="recover">确认恢复演示</button>`)}
function doRecover(){if(!['r1','r2','r3'].every(id=>$(id).checked)){tell('请完成全部现场核对确认项');return}state.lock=false;state.alarm.filter(a=>a.active).forEach(a=>a.active=false);if(state.active)state.active.status='running';record('班组长/工程师演示确认恢复，当前任务阶段保持不变');closeModal();render();tell('演示恢复成功，未重置或重发已执行动作')}
function slotClick(id){const [p,n]=id.split(':'),i=+n,arr=p==='R'?state.raw:p==='C'?state.cooling:state.backpack,m=arr[i];let btn='<button class="btn" data-close="1">关闭</button>';if(p==='C'&&m)btn+='<button class="btn primary" data-confirm="outbound" data-index="'+i+'">确认人工出库</button>';showModal(`库位 ${p}${i+1} · ${m?'已占用':'空闲'}`,`<div class="info-grid"><div class="info-item"><small>库位</small><strong>${p}${i+1}</strong></div><div class="info-item"><small>物料逻辑ID</small><strong>${m?.id||'—'}</strong></div><div class="info-item"><small>物料状态</small><strong>${m?(m.kind==='raw'?'生料':'熟料'):'无'}</strong></div><div class="info-item"><small>目标 / 来源炉</small><strong>${m?.furnace||'—'}</strong></div></div><p class="footnote">本ID为演示逻辑记录ID，不构成现场唯一物理序列号追踪承诺。</p>${p==='C'&&m?'<div class="field"><label>出库原因</label><select id="outReason"><option>水冷完成，人工交接</option><option>人工领用 / 成品转运</option><option>库存盘点调整</option></select></div>':''}`,btn)}
function outbound(i){if(state.lock){tell('恢复锁状态下不能出库');return}const m=state.cooling[i];if(!m){tell('库存已发生变化');return}const reason=$('outReason')?.value||'人工交接';state.cooling[i]=null;ledger(m.id,'熟料出库',`冷却区 C${i+1}`,'人工交接',reason);record(`${m.id} 从冷却区 C${i+1} 完成人工出库`);closeModal();render();tell('出库成功（仅模拟）')}
function furnaceDialog(id){const f=state.furnaces.find(x=>x.id===id);showModal(id+' · 炉位信息',`<div class="info-grid"><div class="info-item"><small>炉状态</small><strong>${furnaceStatus[f.state][0]}</strong></div><div class="info-item"><small>炉内物料</small><strong>${f.material?.id||'无'}</strong></div><div class="info-item"><small>工位</small><strong>LM${id.slice(1)}</strong></div><div class="info-item"><small>Z轴补偿</small><strong>${f.z} mm</strong></div></div><p class="note" style="margin-top:17px">以下操作仅改变原型数据，用于演示炉状态变化。实际生产结束状态应由PLC与现场设备提供。</p>`,`<button class="btn" data-close="1">关闭</button>${f.state==='running'?`<button class="btn primary" data-confirm="finish" data-id="${id}">模拟烧结完成</button>`:''}${['idle','maintenance'].includes(f.state)?`<button class="btn" data-confirm="maintenance" data-id="${id}">切换维护状态</button>`:''}`)}
function finishFurnace(id){const f=state.furnaces.find(x=>x.id===id);if(f.state!=='running')return;f.state='done';f.material.kind='cooked';record(`${id} 模拟烧结完成，熟料等待调度`);closeModal();render();tell(`${id} 已完成，可创建 SWAP/UNLOAD 任务`)}
function maintenance(id){if(!requireLead())return;const f=state.furnaces.find(x=>x.id===id);if(state.active?.furnace===id||state.tasks.some(t=>t.furnace===id&&t.status==='pending')){tell('该炉存在活动或待执行任务，禁止切换维护');return}if(f.material){tell('炉内有物料，不能直接切维护');return}f.state=f.state==='maintenance'?'idle':'maintenance';record(`${id} 切换为${furnaceStatus[f.state][0]}（演示）`);closeModal();render();tell('炉位状态已更新')}
function editZ(id){if(!requireLead())return;const f=state.furnaces.find(x=>x.id===id);showModal(id+' · Z轴补偿',`<div class="field"><label>补偿量（mm）</label><input type="number" id="zValue" min="-20" max="20" step="0.5" value="${f.z}"></div><div class="note">真实控制系统应要求审批与重新标定；此处只修改产品原型演示值。</div>`,`<button class="btn" data-close="1">取消</button><button class="btn primary" data-confirm="z" data-id="${id}">保存演示值</button>`)}
function exportCSV(){const rows=[['时间','物料ID','类型','来源','去向','原因'],...state.ledger.map(x=>[x.at,x.id,x.type,x.from,x.to,x.reason])];const csv='\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='VSRCS_库存流水_演示.csv';a.click();URL.revokeObjectURL(a.href);tell('库存流水 CSV 已导出')}
function action(name){if(name==='makeTask')makeTask();if(name==='inbound')inbound();if(name==='next')nextStep();if(name==='inject')inject();if(name==='recover')recover();if(name==='export')exportCSV();if(name==='battery'){state.battery=Math.max(0,state.battery-15);record('AGV电量模拟下降至 '+state.battery+'%');render();tell('电量已变化（演示）')}if(name==='charge'){if(!requireLead())return;state.battery=90;state.position='LM7';record('LM7人工换电完成，模拟电量恢复 90%');render();tell('已模拟换电（真实设备未操作）')}if(name==='toggleMode'){if(!requireLead())return;state.mode=state.mode==='auto'?'maint':'auto';record('系统演示模式切换为 '+state.mode);render();tell('已切换演示模式')}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){state.page=b.dataset.page;render();return}if(b.dataset.action){action(b.dataset.action);return}if(b.dataset.slot){slotClick(b.dataset.slot);return}if(b.dataset.furnace){furnaceDialog(b.dataset.furnace);return}if(b.dataset.z){editZ(b.dataset.z);return}if(b.dataset.close){closeModal();return}if(b.dataset.confirm){const c=b.dataset.confirm;if(c==='inbound')doInbound();if(c==='task')doTask();if(c==='recover')doRecover();if(c==='outbound')outbound(+b.dataset.index);if(c==='finish')finishFurnace(b.dataset.id);if(c==='maintenance')maintenance(b.dataset.id);if(c==='z'){const v=Number($('zValue').value);if(!Number.isFinite(v)||v< -20||v>20)return tell('请输入 -20 至 20 mm 有效数值');state.furnaces.find(x=>x.id===b.dataset.id).z=v;record(`${b.dataset.id} 补偿参数演示修改为 ${v}mm`);closeModal();render()}return}});
$('resetDemo').addEventListener('click',()=>{if(confirm('要恢复初始演示数据吗？此操作只重置浏览器原型数据，不影响任何真实系统。')){state=initial();render();tell('演示数据已重置')}});
render();
})();
</script>
</body></html>
